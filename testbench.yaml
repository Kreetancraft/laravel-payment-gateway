providers:
  - Livewire\LivewireServiceProvider
  - Flux\FluxServiceProvider
  - Kreetancraft\PaymentGateway\Providers\PaymentGatewayServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

env:
  - APP_NAME="Payment Gateway Bench"
  # Left to the testbench skeleton's own sqlite file, which
  # `workbench:create-sqlite-db` creates. Pointing DB_DATABASE at a path inside
  # workbench/ looks tidier and is not where that command writes.
  - DB_CONNECTION=sqlite
  # Queue runs inline so the re-verify job fires without a worker.
  - QUEUE_CONNECTION=sync
  - CACHE_STORE=file
  - SESSION_DRIVER=file

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
  build:
    - create-sqlite-db
    - migrate:refresh
  assets: []
  sync: []
